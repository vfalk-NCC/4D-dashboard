<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4D-dashboard – Gantt</title>
<style>html,body{margin:0;height:100%;background:#f4f7fc;font:14px system-ui,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#334155;padding:24px}</style></head>
<body><iframe id="f" title="Gantt" allow="clipboard-write; fullscreen"></iframe><div id="msg"></div>
<script>
/* Gantten i ett eget fönster (andra skärmen). Dashboarden i Trimble Connect (fönstret som öppnade den här sidan) behåller kontrollen över modellen; den här sidan är en brygga
   mellan den och Gantten (index.html?embed=gantt) i ramen: meddelanden skickas vidare åt båda håll. */
(() => {
  const f = document.getElementById("f"), msg = document.getElementById("msg"), fail = t => { f.style.display = "none"; msg.style.display = "flex"; msg.textContent = t; };
  if (!window.opener) return fail("Öppna Gantten från dashboardens Gantt-knapp (⧉ Eget fönster) – den här sidan behöver dashboarden som öppnade den.");
  f.src = "index.html?embed=gantt&pop=1";
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin) return;
    if (ev.source === f.contentWindow) { try { window.opener.postMessage({ dpop: true, msg: ev.data }, location.origin); } catch (e) { /* dashboarden stängd */ } }
    else if (ev.source === window.opener && ev.data && ev.data.dpop) { try { f.contentWindow.postMessage(ev.data.msg, location.origin); } catch (e) { /* ingen ram */ } }
  });
  addEventListener("pagehide", () => { try { window.opener.postMessage({ dpop: true, msg: { t: "popupClosed" } }, location.origin); } catch (e) { /* */ } });
})();
</script></body></html>
